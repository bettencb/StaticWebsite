<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">    
    <link rel="icon" type="image/png" href="{{ '/assets/images/hover_emblem.png' | relative_url }}">

    <style>
      body {
        {% if page.background_image %}
          background: url("{{ page.background_image | relative_url }}") no-repeat center center fixed;
          background-size: cover;
        {% else %}
          background-color: #ffffff; 
        {% endif %}
      }
    </style>
</head>

    {% include header.html %}

    <main>
        {{ content }} </main>

</body>
</html>
